[project]
name = "hermes-agent-starter"
version = "0.1.0"
description = "Hermes control plane + CrewAI runtime starter for agent-first apps."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Hermes Agent Starter Contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "typer>=0.12.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "python-dotenv>=1.0.0",
  "jinja2>=3.1.0",
  "orjson>=3.10.0",
  "ag-ui-protocol>=0.1.0",
  "a2a-sdk>=0.3.0",
  "crewai>=1.14.0,<2.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.7.0",
  "mypy>=1.11.0"
]

[project.scripts]
hermes = "hermes_agent.cli:app"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["packages", "."]
testpaths = ["tests"]
