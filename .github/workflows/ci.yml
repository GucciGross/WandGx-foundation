name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "crews/**"
      - "scripts/**"
      - "pyproject.toml"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "crews/**"
      - "scripts/**"
      - "pyproject.toml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint Python
        run: ruff check .
      - name: Test Python
        run: PYTHONPATH=packages:. pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/web/package.json
      - name: Install web deps
        run: cd apps/web && pnpm install --no-frozen-lockfile
      - name: Lint web
        run: cd apps/web && pnpm lint
